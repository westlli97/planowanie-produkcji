{% extends "base.html" %}
{% block title %}Logowanie | Biuro – Produkcja{% endblock %}
{% block content %}
<section class="mx-auto max-w-md rounded-xl border border-slate-200 bg-white p-5 shadow-sm sm:p-8" aria-labelledby="login-heading">
    <h1 id="login-heading" class="text-2xl font-bold">Zaloguj się</h1>
    {% if form.errors %}<p class="mt-4 rounded-lg bg-red-50 p-3 text-sm text-red-800" role="alert">Nieprawidłowy login lub hasło.</p>{% endif %}
    <form method="post" class="mt-6 space-y-5">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div>
            <label for="id_username" class="mb-1 block text-sm font-medium">Login</label>
            <input id="id_username" name="username" autocomplete="username" required autofocus class="min-h-11 w-full rounded-lg border border-slate-300 px-3">
        </div>
        <div>
            <label for="id_password" class="mb-1 block text-sm font-medium">Hasło</label>
            <input id="id_password" type="password" name="password" autocomplete="current-password" required class="min-h-11 w-full rounded-lg border border-slate-300 px-3">
        </div>
        <button type="submit" class="min-h-11 w-full rounded-lg bg-teal-700 px-5 py-3 font-semibold text-white hover:bg-teal-800">Zaloguj się</button>
    </form>
</section>
{% endblock %}
