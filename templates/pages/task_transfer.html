{% extends "base.html" %}
{% block title %}Przekaż zadanie | Biuro – Produkcja{% endblock %}
{% block content %}
<section class="mx-auto max-w-2xl rounded-xl border border-slate-200 bg-white p-5 sm:p-8"><h1 class="text-2xl font-bold">Przekaż zadanie</h1><p class="mt-2 text-slate-700">{{ task.title }}</p><form method="post" class="mt-6 space-y-4">{% csrf_token %}{{ form.as_p }}<button class="min-h-11 rounded-lg bg-teal-700 px-5 py-3 font-semibold text-white" type="submit">Zapisz przypisanie</button></form></section>
{% endblock %}
