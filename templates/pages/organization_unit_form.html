{% extends "base.html" %}
{% block title %}{{ form_title|default:"Jednostka organizacyjna" }} | Biuro – Produkcja{% endblock %}
{% block content %}
<section class="mx-auto max-w-2xl rounded-xl border border-slate-200 bg-white p-5 sm:p-8">
    <h1 class="text-2xl font-bold">{{ form_title|default:"Edytuj jednostkę" }}</h1>
    <form method="post" class="mt-6 space-y-4">{% csrf_token %}{{ form.as_p }}<button type="submit" class="min-h-11 rounded-lg bg-teal-700 px-5 py-3 font-semibold text-white">Zapisz</button></form>
    <a class="mt-4 inline-block min-h-11 py-3 text-teal-800" href="{% url 'accounts:organization-panel' %}">Wróć do struktury</a>
</section>
{% endblock %}
