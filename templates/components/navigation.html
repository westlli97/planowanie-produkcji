<header class="border-b border-slate-200 bg-white" x-data="{ menuOpen: false }">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6">
        <a href="/" class="text-lg font-bold text-teal-800" aria-label="Biuro – Produkcja, strona główna">Biuro – Produkcja</a>
        <nav class="hidden items-center gap-6 sm:flex" aria-label="Nawigacja główna">
            <a class="text-sm font-medium text-slate-700 hover:text-teal-800" href="{% url 'requests:list' %}">Zgłoszenia</a>
            <a class="text-sm font-medium text-slate-700 hover:text-teal-800" href="{% url 'production:task-list' %}">Zadania</a>
            {% if request.user.is_authenticated %}
                <form method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button class="min-h-11 text-sm font-medium text-slate-700 hover:text-teal-800" type="submit">Wyloguj się</button>
                </form>
            {% else %}
                <a class="text-sm font-medium text-slate-700 hover:text-teal-800" href="{% url 'accounts:login' %}">Zaloguj się</a>
            {% endif %}
        </nav>
        <button type="button" class="min-h-11 min-w-11 rounded-lg border border-slate-300 px-3 text-sm font-medium sm:hidden"
                @click="menuOpen = !menuOpen" :aria-expanded="menuOpen.toString()" aria-controls="mobile-navigation">
            <span x-text="menuOpen ? 'Zamknij' : 'Menu'"></span>
        </button>
    </div>
    <nav id="mobile-navigation" class="border-t border-slate-200 px-4 py-3 sm:hidden" aria-label="Nawigacja mobilna" x-show="menuOpen" x-cloak>
        <a class="block min-h-11 py-3 text-sm font-medium text-slate-700" href="{% url 'requests:list' %}">Zgłoszenia</a>
        <a class="block min-h-11 py-3 text-sm font-medium text-slate-700" href="{% url 'production:task-list' %}">Zadania</a>
        {% if request.user.is_authenticated %}
            <form method="post" action="{% url 'accounts:logout' %}">
                {% csrf_token %}
                <button class="min-h-11 py-3 text-sm font-medium text-slate-700" type="submit">Wyloguj się</button>
            </form>
        {% else %}
            <a class="block min-h-11 py-3 text-sm font-medium text-slate-700" href="{% url 'accounts:login' %}">Zaloguj się</a>
        {% endif %}
    </nav>
</header>
